[package]
name = "wafc-usb-provisioner"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Analysis Workstation backend for provisioning signed WAFC USB bundles"
publish = false

[dependencies]
anyhow = "=1.0.99"
argon2 = "=0.5.3"
base64 = "=0.22.1"
chacha20poly1305 = { version = "=0.10.1", features = ["std"] }
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde", "std"] }
ed25519-dalek = { version = "=3.0.0", features = ["alloc", "pkcs8", "rand_core"] }
getopts = "=0.2.23"
getrandom = "=0.4.3"
hex = "=0.4.3"
portable-config = { path = "../../../field-collector/crates/portable-config", features = ["provisioning"] }
rpassword = "=7.4.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
thiserror = "=2.0.16"
uuid = { version = "=1.18.0", features = ["serde", "v4"] }
zeroize = { version = "=1.8.1", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.21.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
