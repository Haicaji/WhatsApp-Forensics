[package]
name = "waeb-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "Independent verifier for WA Evidence Bag v1"
publish = false

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=3.0.0", features = ["pkcs8"] }
hex = "=0.4.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_jcs = "=0.1.0"
serde_json = "=1.0.143"
sha2 = "=0.10.9"
thiserror = "=2.0.16"
unicode-normalization = "=0.1.24"

[dev-dependencies]
tempfile = "=3.21.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
