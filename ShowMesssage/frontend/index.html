<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161717" />
    <title>ShowMesssage · WhatsApp 聊天记录查看器</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="vendor/jszip.min.js"></script>
    <script defer src="parser.js"></script>
    <script defer src="datetime.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-busy="false">
      <nav class="nav-rail" aria-label="主导航">
        <div class="nav-primary">
          <button id="chatNavButton" class="nav-button is-selected" type="button" aria-label="对话" aria-current="page" data-tooltip="对话">
            <svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg>
          </button>
          <button class="nav-button" type="button" aria-label="通话" aria-disabled="true" data-offline data-tooltip="通话 · 离线 ZIP 不支持">
            <svg class="icon" aria-hidden="true"><use href="#icon-calls"></use></svg>
          </button>
          <button class="nav-button" type="button" aria-label="动态" aria-disabled="true" data-offline data-tooltip="动态 · 离线 ZIP 不支持">
            <svg class="icon" aria-hidden="true"><use href="#icon-status"></use></svg>
          </button>
          <button class="nav-button" type="button" aria-label="频道" aria-disabled="true" data-offline data-tooltip="频道 · 离线 ZIP 不支持">
            <svg class="icon" aria-hidden="true"><use href="#icon-channel"></use></svg>
          </button>
          <button class="nav-button" type="button" aria-label="社群" aria-disabled="true" data-offline data-tooltip="社群 · 离线 ZIP 不支持">
            <svg class="icon" aria-hidden="true"><use href="#icon-community"></use></svg>
          </button>
        </div>

        <div class="nav-footer">
          <button id="mediaLibraryButton" class="nav-button" type="button" aria-label="影音内容" aria-disabled="true" data-tooltip="载入 ZIP 后查看影音内容">
            <svg class="icon" aria-hidden="true"><use href="#icon-media-library"></use></svg>
          </button>
          <button id="profileButton" class="nav-button profile-dot" type="button" aria-label="自己" aria-disabled="true" data-tooltip="载入 ZIP 后查看当前用户">
            <svg class="icon" aria-hidden="true"><use href="#icon-user"></use></svg>
          </button>
        </div>
      </nav>

      <aside id="chatDrawer" class="chat-drawer" aria-label="会话列表">
        <header class="chat-list-header">
          <div class="wordmark">WhatsApp</div>
          <div class="header-actions">
            <button id="headerOpenButton" class="icon-button" type="button" aria-label="打开新的 ZIP" title="打开新的 ZIP">
              <svg class="icon" aria-hidden="true"><use href="#icon-folder-plus"></use></svg>
            </button>
            <button id="archiveInfoButton" class="icon-button" type="button" aria-label="ZIP 文件信息" disabled data-tooltip="载入 ZIP 后查看文件信息">
              <svg class="icon" aria-hidden="true"><use href="#icon-info"></use></svg>
            </button>
            <button id="mobileSettingsButton" class="icon-button header-settings-action" type="button" aria-label="设置" title="设置">
              <svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg>
            </button>
            <button class="icon-button" type="button" aria-label="更多选项" aria-disabled="true" data-offline data-tooltip="只读模式下不可用">
              <svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg>
            </button>
          </div>
        </header>

        <div class="search-row">
          <label class="search-box" for="chatSearch">
            <svg class="icon search-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
            <input id="chatSearch" type="search" placeholder="搜索或开始新聊天" autocomplete="off" disabled />
          </label>
        </div>

        <div id="filterRow" class="filter-row" role="tablist" aria-label="会话筛选">
          <button class="filter-chip is-active" type="button" role="tab" aria-selected="true" data-filter="all">全部</button>
          <button class="filter-chip" type="button" role="tab" aria-selected="false" data-filter="unread">未读</button>
          <button class="filter-chip" type="button" role="tab" aria-selected="false" data-filter="favorites">星标消息</button>
          <button class="filter-chip" type="button" role="tab" aria-selected="false" data-filter="groups">群组</button>
        </div>

        <div class="chat-list-scroll">
          <div id="chatList" class="chat-list" role="listbox" aria-label="聊天"></div>
          <div id="chatListEmpty" class="chat-list-empty" hidden>
            <p>没有找到任何对话、联系人或消息</p>
            <button id="emptyResetButton" class="text-button" type="button">清除搜索和筛选</button>
          </div>
        </div>

        <div class="drawer-security">
          <div class="offline-state">
            <svg class="mini-icon" aria-hidden="true"><use href="#icon-info"></use></svg>
            <span>该页面仅为提取出数据的静态展示，并非原始 WhatsApp 网页镜像</span>
          </div>
        </div>

        <section id="profileView" class="profile-view" hidden aria-labelledby="profileViewTitle">
          <header class="profile-view-header">
            <button id="profileBackButton" class="icon-button" type="button" aria-label="返回对话">
              <svg class="icon" aria-hidden="true"><use href="#icon-back"></use></svg>
            </button>
            <h2 id="profileViewTitle">个人主页</h2>
          </header>
          <div id="profileViewContent" class="profile-view-content"></div>
        </section>

        <section id="settingsView" class="profile-view settings-view" hidden aria-labelledby="settingsViewTitle">
          <header class="profile-view-header">
            <button id="settingsBackButton" class="icon-button" type="button" aria-label="返回对话">
              <svg class="icon" aria-hidden="true"><use href="#icon-back"></use></svg>
            </button>
            <h2 id="settingsViewTitle">设置</h2>
          </header>
          <div id="settingsViewContent" class="profile-view-content settings-view-content"></div>
        </section>
      </aside>

      <main id="conversationPanel" class="conversation-panel">
        <section id="welcomePanel" class="welcome-panel" aria-label="未选择聊天记录"></section>

        <section id="conversationView" class="conversation-view" hidden aria-label="聊天内容">
          <header class="conversation-header">
            <button id="backToChats" class="icon-button back-button" type="button" aria-label="返回会话列表">
              <svg class="icon" aria-hidden="true"><use href="#icon-back"></use></svg>
            </button>
            <button id="conversationAvatar" class="avatar avatar-small avatar-button" type="button" aria-label="查看联系人信息"></button>
            <div class="conversation-heading">
              <h2 id="conversationTitle"></h2>
              <p id="conversationSubtitle"></p>
            </div>
            <div class="conversation-actions">
              <button class="icon-button desktop-call-action" type="button" aria-label="视频通话" aria-disabled="true" data-offline data-tooltip="视频通话 · 离线 ZIP 不支持">
                <svg class="icon" aria-hidden="true"><use href="#icon-video-call"></use></svg>
              </button>
              <button class="icon-button desktop-call-action" type="button" aria-label="语音通话" aria-disabled="true" data-offline data-tooltip="语音通话 · 离线 ZIP 不支持">
                <svg class="icon" aria-hidden="true"><use href="#icon-phone"></use></svg>
              </button>
              <button id="conversationSearchButton" class="icon-button" type="button" aria-label="在会话中搜索">
                <svg class="icon" aria-hidden="true"><use href="#icon-search"></use></svg>
              </button>
              <button class="icon-button" type="button" aria-label="更多选项" aria-disabled="true" data-offline data-tooltip="只读模式下不可用">
                <svg class="icon" aria-hidden="true"><use href="#icon-more"></use></svg>
              </button>
            </div>
          </header>

          <div id="messagesBody" class="messages-body">
            <div class="wallpaper" aria-hidden="true"></div>
            <div id="messageList" class="message-list" role="log" aria-live="off"></div>
            <div id="floatingDate" class="floating-date" aria-hidden="true" hidden></div>
          </div>

          <footer class="compose-box" aria-label="只读模式">
            <button class="icon-button compose-action" type="button" aria-label="添加附件（只读模式不可用）" disabled>
              <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
            </button>
            <div class="compose-input" aria-disabled="true">只读查看器，无法发送消息</div>
            <button class="icon-button compose-action" type="button" aria-label="语音消息（只读模式不可用）" disabled>
              <svg class="icon" aria-hidden="true"><use href="#icon-mic"></use></svg>
            </button>
          </footer>
        </section>

        <aside id="detailPanel" class="detail-panel" hidden aria-labelledby="detailPanelTitle">
          <header class="detail-panel-header">
            <button id="detailPanelClose" class="icon-button" type="button" aria-label="关闭">
              <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
            </button>
            <h2 id="detailPanelTitle"></h2>
          </header>
          <div id="detailPanelContent" class="detail-panel-content"></div>
        </aside>
      </main>
    </div>

    <input id="zipInput" class="visually-hidden" type="file" accept=".zip,application/zip,application/x-zip-compressed" />

    <div id="dropOverlay" class="drop-overlay" hidden>
      <div class="drop-card">
        <svg class="drop-icon" aria-hidden="true"><use href="#icon-folder-plus"></use></svg>
        <strong>松开以打开聊天记录</strong>
        <span>仅接受 ZAPiXWEB ZIP</span>
      </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay" hidden role="status" aria-live="polite">
      <div class="loading-card">
        <div class="loading-mark">
          <svg aria-hidden="true"><use href="#icon-whatsapp"></use></svg>
        </div>
        <strong id="loadingTitle">正在读取 ZIP…</strong>
        <div class="progress-track" aria-hidden="true"><span id="loadingProgress"></span></div>
        <span id="loadingDetail">所有数据都留在本机</span>
      </div>
    </div>

    <dialog id="mediaDialog" class="media-dialog" aria-labelledby="mediaDialogTitle" aria-describedby="mediaDialogMeta">
      <div class="media-dialog-header">
        <div class="media-dialog-title-group">
          <strong id="mediaDialogTitle">媒体预览</strong>
          <div class="media-dialog-subline">
            <span id="mediaDialogMeta"></span>
            <span id="mediaDialogCounter" class="media-dialog-counter" aria-live="polite"></span>
          </div>
        </div>
        <div class="media-dialog-actions">
          <button id="mediaDownloadButton" class="icon-button" type="button" aria-label="下载文件" title="下载">
            <svg class="icon" aria-hidden="true"><use href="#icon-download"></use></svg>
          </button>
          <button id="mediaCloseButton" class="icon-button" type="button" aria-label="关闭预览" title="关闭">
            <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </div>
      </div>
      <button id="mediaPreviousButton" class="media-dialog-nav is-previous" type="button" aria-label="查看上一个媒体" title="上一个（左方向键）" hidden>
        <svg class="icon" aria-hidden="true"><use href="#icon-chevron-left"></use></svg>
      </button>
      <div id="mediaDialogContent" class="media-dialog-content"></div>
      <button id="mediaNextButton" class="media-dialog-nav is-next" type="button" aria-label="查看下一个媒体" title="下一个（右方向键）" hidden>
        <svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"></use></svg>
      </button>
    </dialog>

    <dialog id="libraryDialog" class="library-dialog" aria-labelledby="libraryDialogTitle">
      <header class="library-dialog-header">
        <div>
          <strong id="libraryDialogTitle">影音内容</strong>
          <span id="libraryDialogSubtitle">所有聊天中的影音内容</span>
        </div>
        <button id="libraryDialogClose" class="icon-button" type="button" aria-label="关闭影音内容">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </header>
      <div id="libraryTabs" class="library-tabs" role="tablist" aria-label="附件类型">
        <button id="libraryTabMedia" class="library-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="libraryDialogContent" data-library-tab="media">影音内容</button>
        <button id="libraryTabDocuments" class="library-tab" type="button" role="tab" aria-selected="false" aria-controls="libraryDialogContent" data-library-tab="documents" tabindex="-1">文档</button>
        <button id="libraryTabLinks" class="library-tab" type="button" role="tab" aria-selected="false" aria-controls="libraryDialogContent" data-library-tab="links" tabindex="-1">链接</button>
      </div>
      <div id="libraryDialogContent" class="library-dialog-content" role="tabpanel" aria-labelledby="libraryTabMedia"></div>
    </dialog>

    <dialog id="archiveInfoDialog" class="archive-info-dialog" aria-labelledby="archiveInfoDialogTitle">
      <header class="archive-info-dialog-header">
        <div>
          <strong id="archiveInfoDialogTitle">ZIP 文件信息</strong>
          <span>提取包与本地查看器元数据</span>
        </div>
        <button id="archiveInfoDialogClose" class="icon-button" type="button" aria-label="关闭 ZIP 文件信息">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </header>
      <div id="archiveInfoDialogContent" class="archive-info-dialog-content"></div>
    </dialog>

    <div id="toast" class="toast" hidden role="alert"></div>

      <symbol id="icon-back" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-mic" viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z" fill="currentColor"/></symbol>
