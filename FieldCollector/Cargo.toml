[package]
name = "field-collector-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
description = "JSON-first WhatsApp Web extraction prototype"

[dependencies]
anyhow = "=1.0.99"
base64 = "=0.22.1"
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde", "std"] }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "glow"] }
futures-util = "=0.3.31"
getrandom = "=0.4.3"
hex = "=0.4.3"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
thiserror = "=2.0.16"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "=0.30.0"
url = "=2.5.7"
uuid = { version = "=1.18.0", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
