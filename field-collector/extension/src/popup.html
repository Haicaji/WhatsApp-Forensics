<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WAFC 只读取证连接器</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <div class="brand">WAFC</div>
      <h1>连接当前 WhatsApp 页面</h1>
      <p class="lead">请确认当前标签页是 <strong>web.whatsapp.com</strong>，再输入 Field Collector 显示的一次性配对码。</p>

      <label for="pairing-code">一次性配对码</label>
      <input
        id="pairing-code"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        maxlength="10"
        placeholder="例如 7K9M2R4TQX"
      >
      <button id="connect" type="button">确认当前页并连接</button>

      <section id="status" class="status" role="status" aria-live="polite">
        等待输入配对码
      </section>

      <div class="boundary">
        <strong>只读边界</strong>
        <ul>
          <li>只连接当前 WhatsApp Web 标签页</li>
          <li>不发送消息、不建群、不点击聊天</li>
          <li>综合任务可能请求历史与媒体，并产生网络或缓存变化</li>
          <li>关闭或切换页面会立即停止</li>
        </ul>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
